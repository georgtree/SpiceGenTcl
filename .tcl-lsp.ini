[project]
dialect = tcl90
entryPoints = 
    SpiceGenTcl.tcl

[optimiser]
enabled = true

[diagnostics]
enabled = true
disabled = W210, W108, W212, W307, T100
exclude =
    docs/**
    *.ruff

[shimmer]
enabled = true

[features]
inlayHints = false
inlayTypeHints = false
inlayParameterHints = false

[formatting]
indent_size = 4